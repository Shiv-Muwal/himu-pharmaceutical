name: Deploy Himu Pharmaceutical

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /var/www/himu-pharmaceutical

            echo "Pulling latest code..."
            git pull origin master

            # Drop baked staging API hosts from server env (breaks live login DNS)
            for envfile in frontend/.env Admin/.env admin/.env; do
              if [ -f "$envfile" ]; then
                sed -i 's|^VITE_API_URL=https\?://sitetest\..*|VITE_API_URL=|' "$envfile" || true
                sed -i 's|^VITE_STOREFRONT_URL=https\?://sitetest\..*|VITE_STOREFRONT_URL=|' "$envfile" || true
              fi
            done

            ########################
            # Frontend
            ########################

            cd frontend
            npm ci
            # Same-origin /api via nginx — never bake sitetest/localhost API hosts
            VITE_API_URL= npm run build

            ########################
            # Admin
            ########################

            cd ../Admin
            npm ci
            VITE_API_URL= VITE_STOREFRONT_URL= npm run build

            ########################
            # Backend
            ########################

            cd ../himu-backend
            npm ci

            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

            sudo systemctl reload nginx

            echo "Deployment Finished Successfully"