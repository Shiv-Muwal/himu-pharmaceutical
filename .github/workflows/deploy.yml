name: Deploy HIMU

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /var/www/Himu/himu-pharmaceutical

            git pull origin master

            # Backend
            cd himu-backend
            npm install
            pm2 restart himu-backend --update-env

            # Frontend
            cd ../frontend
            npm install
            npm run build

            # Admin
            cd ../Admin
            npm install
            npm run build

            sudo systemctl reload nginx