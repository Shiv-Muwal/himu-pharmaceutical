# HIMU storefront — SPA-safe nginx site snippet
# Problem: a static folder named `products` made `/products` reload return 403.
# Images now live under /product-media/... so /products is free for React Router.
#
# Install (on EC2): copy into /etc/nginx/sites-available/ and enable, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name himupharmaceutical.com www.himupharmaceutical.com;

    root /var/www/Himu/himu-pharmaceutical/frontend/dist;
    index index.html;

    # API → Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files from backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets (images, js, css) — serve files only; never directory index
    location /product-media/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /banners/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # React SPA: critical — do NOT use `$uri/` (that causes 403 on folders)
    location / {
        try_files $uri /index.html;
    }
}
