# HIMU — storefront + admin + API (SPA-safe)
#
# Install on EC2:
#   sudo cp deploy/nginx-himu.conf /etc/nginx/sites-available/himu.conf
#   sudo ln -sfn /etc/nginx/sites-available/himu.conf /etc/nginx/sites-enabled/himu.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Important:
# - Backend must listen on 127.0.0.1:5001 or /api returns 502.
# - Prefer `try_files $uri /index.html` (no `$uri/`) for the storefront.

server {
    listen 80;
    listen [::]:80;
    server_name sitetest.himupharmaceutical.com himupharmaceutical.com www.himupharmaceutical.com;

    root /var/www/Himu/himu-pharmaceutical/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    # ---------- API (Node / PM2 on :5001) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # ---------- Admin SPA (/admin/) ----------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /var/www/Himu/himu-pharmaceutical/admin/dist/;
        index index.html;
        try_files $uri $uri/ @admin_spa;
    }

    location @admin_spa {
        rewrite ^ /admin/index.html last;
    }

    location = /admin/index.html {
        alias /var/www/Himu/himu-pharmaceutical/admin/dist/index.html;
    }

    # ---------- Static media ----------
    location /product-media/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /banners/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # ---------- Storefront SPA ----------
    location / {
        try_files $uri /index.html;
    }
}
